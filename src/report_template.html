<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bongo Cat 按键统计</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#6b7385;--line:#e3e6ec;--acc:#e8733a;--cell:#eceff4;--cellfg:#3b4252}
@media(prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1d2027;--fg:#e8eaf0;--mut:#9aa2b4;--line:#2d313b;--acc:#f08a52;--cell:#2a2e38;--cellfg:#c8ceda}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:20px 28px 8px}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:12px}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--fg);padding:6px 14px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#fff}
main{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;padding:12px 28px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.stat{grid-column:span 3}
.stat .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--mut);font-size:12px}
.w12{grid-column:span 12}.w8{grid-column:span 8}.w7{grid-column:span 7}.w6{grid-column:span 6}.w5{grid-column:span 5}.w4{grid-column:span 4}
@media(max-width:900px){.stat{grid-column:span 6}.w8,.w7,.w6,.w5,.w4{grid-column:span 12}}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--fg);font-family:inherit}
.m{fill:var(--mut)!important}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{cursor:pointer;color:var(--mut);font-weight:600;user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.empty{color:var(--mut);padding:30px;text-align:center}
.scroll{max-height:420px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>Bongo Cat 按键统计</h1>
  <span class="sub" id="gen"></span>
  <div class="seg" id="seg"><button data-m="total" class="on">累计</button><button data-m="session">本次会话</button></div>
</header>
<main id="main"></main>
<script>
const D = /*__DATA__*/null;
const $ = (s, e) => (e || document).querySelector(s);
const fmt = n => n.toLocaleString('en-US');
const sum = a => a.reduce((x, y) => x + y, 0);
const NS = 'http://www.w3.org/2000/svg';
const PAL = ['#4e79a7', '#f28e2b', '#59a14f', '#b07aa1', '#e15759', '#76b7b2', '#edc948', '#9c755f'];
const GN = {Letters:'字母', Numbers:'数字', Modifiers:'修饰键', Function:'功能键', Navigation:'导航键', Symbols:'符号键', Numpad:'小键盘', Other:'其他'};
let mode = 'total';

function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function card(cls, title) {
  const c = document.createElement('section');
  c.className = 'card ' + cls;
  if (title) { const h = document.createElement('h2'); h.textContent = title; c.appendChild(h); }
  return c;
}
function nm(vk) { const n = D.names[vk]; return n ? n[0] : 'VK' + vk; }
function grp(vk) { const n = D.names[vk]; return n ? n[1] : 7; }
function mix(t) { // light grey-blue -> orange, sqrt-scaled
  t = Math.sqrt(Math.max(0, Math.min(1, t)));
  const a = [236, 239, 244], b = [232, 115, 58];
  return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';
}

function render() {
  const data = D[mode], all = sum(data);
  const main = $('#main'); main.innerHTML = '';
  $('#gen').textContent = '生成于 ' + D.generated + ' · 起始 ' + (D.firstRun || '-');

  const days = Object.keys(D.daily).sort();
  const dayTotals = days.map(d => sum(D.daily[d]));
  const todayN = D.daily[D.today] ? sum(D.daily[D.today]) : 0;
  const stats = [['累计按键', sum(D.total)], ['今日', todayN], ['本次会话', sum(D.session)], ['使用天数', days.filter((d, i) => dayTotals[i] > 0).length]];
  for (const [l, v] of stats) {
    const c = card('stat'); c.innerHTML = '<div class="v">' + fmt(v) + '</div><div class="l">' + l + '</div>'; main.appendChild(c);
  }
  if (!all) { const c = card('w12'); c.innerHTML = '<div class="empty">该口径下还没有记录。</div>'; main.appendChild(c); return; }

  // keyboard heat map
  { const c = card('w12', '键盘热力图（颜色越深次数越多，悬停查看）');
    const U = 40, max = Math.max(...D.layout.map(k => data[k[0]]), 1);
    let w = 0, h = 0; D.layout.forEach(k => { w = Math.max(w, k[2] + k[4]); h = Math.max(h, k[3] + 1); });
    const svg = el('svg', {viewBox: '0 0 ' + (w * U) + ' ' + (h * U)});
    for (const [vk, lab, x, y, kw] of D.layout) {
      const n = data[vk], g = el('g');
      g.appendChild(el('title', {}, nm(vk) + '：' + fmt(n) + ' 次（' + (n * 100 / all).toFixed(1) + '%）'));
      g.appendChild(el('rect', {x: x * U + 1.5, y: y * U + 1.5, width: kw * U - 3, height: U - 3, rx: 5, fill: n ? mix(n / max) : 'var(--cell)'}));
      const t = el('text', {x: x * U + kw * U / 2, y: y * U + U / 2 + 4, 'text-anchor': 'middle', 'font-size': lab.length > 3 ? 10 : 13, fill: n / max > .55 ? '#fff' : 'var(--cellfg)'}, lab);
      t.style.fill = !n ? 'var(--cellfg)' : n / max > .55 ? '#fff' : '#1d2330';
      g.appendChild(t); svg.appendChild(g);
    }
    c.appendChild(svg); main.appendChild(c); }

  // top 20
  { const c = card('w7', 'Top 20 按键');
    const rows = [...Array(256).keys()].filter(i => data[i] > 0).sort((a, b) => data[b] - data[a]).slice(0, 20);
    const RH = 24, W = 560, L = 80, R = 110, svg = el('svg', {viewBox: '0 0 ' + W + ' ' + (rows.length * RH + 4)});
    const mx = data[rows[0]];
    rows.forEach((vk, i) => {
      const y = i * RH + 2, bw = Math.max(2, (W - L - R) * data[vk] / mx);
      svg.appendChild(el('text', {x: L - 8, y: y + 16, 'text-anchor': 'end', 'font-size': 12}, nm(vk)));
      svg.appendChild(el('rect', {x: L, y: y + 3, width: bw, height: RH - 8, rx: 3, fill: PAL[grp(vk) % PAL.length]}));
      svg.appendChild(el('text', {x: L + bw + 6, y: y + 16, 'font-size': 12, class: 'm'}, fmt(data[vk]) + '  ' + (data[vk] * 100 / all).toFixed(1) + '%'));
    });
    c.appendChild(svg); main.appendChild(c); }

  // group donut
  { const c = card('w5', '按键分组占比');
    const gs = D.groups.map((g, i) => [g, i, 0]);
    data.forEach((n, vk) => { if (n) gs[grp(vk)][2] += n; });
    const parts = gs.filter(g => g[2] > 0);
    const svg = el('svg', {viewBox: '-110 -110 220 220'}); let a0 = -Math.PI / 2; const R1 = 100, R0 = 62;
    for (const [g, i, n] of parts) {
      const a1 = a0 + Math.PI * 2 * n / all, full = parts.length === 1, big = a1 - a0 > Math.PI ? 1 : 0;
      const P = (r, a) => (r * Math.cos(a)).toFixed(2) + ' ' + (r * Math.sin(a)).toFixed(2);
      const d = full ? 'M 0 -' + R1 + ' A ' + R1 + ' ' + R1 + ' 0 1 1 0 ' + R1 + ' A ' + R1 + ' ' + R1 + ' 0 1 1 0 -' + R1 + ' M 0 -' + R0 + ' A ' + R0 + ' ' + R0 + ' 0 1 0 0 ' + R0 + ' A ' + R0 + ' ' + R0 + ' 0 1 0 0 -' + R0 + ' Z'
        : 'M ' + P(R1, a0) + ' A ' + R1 + ' ' + R1 + ' 0 ' + big + ' 1 ' + P(R1, a1 - 0.01) + ' L ' + P(R0, a1 - 0.01) + ' A ' + R0 + ' ' + R0 + ' 0 ' + big + ' 0 ' + P(R0, a0) + ' Z';
      const p = el('path', {d, fill: PAL[i % PAL.length], 'fill-rule': 'evenodd'});
      p.appendChild(el('title', {}, (GN[g] || g) + '：' + fmt(n) + ' 次（' + (n * 100 / all).toFixed(1) + '%）'));
      svg.appendChild(p); a0 = a1;
    }
    svg.appendChild(el('text', {x: 0, y: -2, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700}, fmt(all)));
    svg.appendChild(el('text', {x: 0, y: 16, 'text-anchor': 'middle', 'font-size': 11, class: 'm'}, '次按键'));
    c.appendChild(svg);
    const lg = document.createElement('div'); lg.className = 'legend';
    for (const [g, i, n] of parts) lg.innerHTML += '<span><i style="background:' + PAL[i % PAL.length] + '"></i>' + (GN[g] || g) + ' ' + (n * 100 / all).toFixed(1) + '%</span>';
    c.appendChild(lg); main.appendChild(c); }

  // daily trend, last 30 days
  { const c = card('w8', '最近 30 天每日按键数');
    const list = [], now = new Date(D.today + 'T00:00:00');
    for (let i = 29; i >= 0; i--) {
      const d = new Date(now); d.setDate(d.getDate() - i);
      const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      list.push([k, D.daily[k] ? sum(D.daily[k]) : 0]);
    }
    const W = 640, H = 220, L = 46, B = 26, T = 10, mx = Math.max(...list.map(x => x[1]), 1);
    const svg = el('svg', {viewBox: '0 0 ' + W + ' ' + H});
    for (let i = 0; i <= 4; i++) {
      const y = T + (H - B - T) * i / 4;
      svg.appendChild(el('line', {x1: L, x2: W - 6, y1: y, y2: y, stroke: 'var(--line)'}));
      svg.appendChild(el('text', {x: L - 6, y: y + 4, 'text-anchor': 'end', 'font-size': 10, class: 'm'}, fmt(Math.round(mx * (4 - i) / 4))));
    }
    const X = i => L + (W - L - 10) * i / 29, Y = v => T + (H - B - T) * (1 - v / mx);
    svg.appendChild(el('path', {d: 'M ' + list.map((p, i) => X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' L '), fill: 'none', stroke: 'var(--acc)', 'stroke-width': 2}));
    list.forEach((p, i) => {
      const dot = el('circle', {cx: X(i), cy: Y(p[1]), r: 3, fill: 'var(--acc)'});
      dot.appendChild(el('title', {}, p[0] + '：' + fmt(p[1]) + ' 次')); svg.appendChild(dot);
      if (i % 5 === 0 || i === 29) svg.appendChild(el('text', {x: X(i), y: H - 8, 'text-anchor': 'middle', 'font-size': 10, class: 'm'}, p[0].slice(5)));
    });
    c.appendChild(svg); main.appendChild(c); }

  // hour of day
  { const c = card('w4', '一天中的时段分布（所有记录）');
    const hr = new Array(24).fill(0); for (const k in D.hourly) D.hourly[k].forEach((v, i) => hr[i] += v);
    const W = 360, H = 220, B = 24, mx = Math.max(...hr, 1), svg = el('svg', {viewBox: '0 0 ' + W + ' ' + H}), bw = W / 24;
    hr.forEach((v, i) => {
      const h = (H - B - 10) * v / mx, r = el('rect', {x: i * bw + 2, y: H - B - h, width: bw - 4, height: h, rx: 2, fill: 'var(--acc)'});
      r.appendChild(el('title', {}, i + ':00  ' + fmt(v) + ' 次')); svg.appendChild(r);
      if (i % 3 === 0) svg.appendChild(el('text', {x: i * bw + bw / 2, y: H - 8, 'text-anchor': 'middle', 'font-size': 10, class: 'm'}, i));
    });
    c.appendChild(svg); main.appendChild(c); }

  // table
  { const c = card('w12', '按键明细（点击表头排序）');
    const rows = [...Array(256).keys()].filter(i => D.total[i] > 0 || D.session[i] > 0).map(vk => ({vk, name: nm(vk), group: GN[D.groups[grp(vk)]] || '', t: D.total[vk], s: D.session[vk]}));
    const tT = sum(D.total) || 1, tS = sum(D.session) || 1;
    const cols = [['name', '按键'], ['group', '分组'], ['t', '累计'], ['tp', '累计占比'], ['s', '本次'], ['sp', '本次占比']];
    let key = mode === 'session' ? 's' : 't', asc = false;
    const box = document.createElement('div'); box.className = 'scroll';
    function draw() {
      const val = r => key === 'tp' ? r.t : key === 'sp' ? r.s : r[key];
      rows.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * (asc ? 1 : -1); });
      box.innerHTML = '<table><thead><tr>' + cols.map(c => '<th data-k="' + c[0] + '">' + c[1] + (c[0] === key ? (asc ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr><td>' + r.name.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</td><td>' + r.group + '</td><td>' + fmt(r.t) + '</td><td>' + (r.t * 100 / tT).toFixed(1) + '%</td><td>' + fmt(r.s) + '</td><td>' + (r.s * 100 / tS).toFixed(1) + '%</td></tr>').join('') + '</tbody></table>';
      box.querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; if (k === key) asc = !asc; else { key = k; asc = k === 'name' || k === 'group'; } draw(); });
    }
    draw(); c.appendChild(box); main.appendChild(c); }
}

document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
render();
</script>
</body>
</html>
